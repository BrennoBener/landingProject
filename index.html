<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | Ponto Igui</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="carousel" id="mainCarousel"></div>

    <div id="galleryModal" class="modal">
        <button class="close-btn" onclick="fecharGaleria()">✕ Fechar</button>
        <div class="gallery-carousel" id="galleryContainer"></div>
    </div>
    
    <!-- Botão Flutuante do Carrinho -->
    <div class="cart-floating-btn" onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="cart-count">0</span>)
    </div>

    <!-- Modal do Carrinho -->
    <div id="cartModal" class="modal">
        <div class="cart-container">
            <div class="cart-header">
                <h2>Seu Pedido</h2>
                <button class="close-btn-cart" onclick="fecharCarrinho()">✕ Fechar</button>
            </div>
            <div id="cartItems" class="cart-items">
                <!-- Itens injetados via JS -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">Total: <span id="cartTotal">R$ 0,00</span></div>
                <button class="btn btn-whatsapp cart-checkout-btn" onclick="finalizarPedido()">Finalizar Pedido ➔</button>
            </div>
        </div>
    </div>
    
    <!-- A ORDEM IMPORTA: Primeiro os dados, depois a lógica que lê os dados -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="script.js"></script>
</body>
</html>
